<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Jurídico</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../../assets/css/styleia.css">
</head>
<body>

<!-- Botão para abrir sidebar -->
<button id="open-sidebar" class="floating-btn"><i class="bi bi-layout-sidebar-inset"></i></button>

<!-- SIDEBAR -->
<aside id="sidebar" class="closed">
    <h2>⚙ Legisla.IA</h2>

    <button onclick="novaConversa()"><i class="bi bi-files"></i>&nbsp; Nova conversa</button>
    
    <button onclick="alert('Configurações em breve!')"><i class="bi bi-gear"></i>&nbsp; Configurações</button>

    <a href="../../../public/index.php"> <i class="bi bi-arrow-left"></i>&nbsp; Sair</a>

    <button id="close-sidebar" class="close-btn"><i class="bi bi-backspace-reverse-fill"></i></button>
</aside>

<!-- CHAT CONTAINER -->
<div id="chat-container">
    <div id="messages"></div>

    <div id="input-area">
        <input id="input-text" type="text" placeholder="Digite sua pergunta...">
        <button id="send-btn"><i class="bi bi-send"></i></button>

        <label for="pdf-input" class="icon-btn"><i class="bi bi-files"></i></label>
        <input id="pdf-input" type="file" accept="application/pdf">
    </div>
</div>

<script src="../../../public/JS/script.js"></script>
</body>
</html>
